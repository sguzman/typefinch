name: Typefinch CI
concurrency:
  group: typefinch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config xvfb xdotool imagemagick mesa-utils openbox xclip lua5.4 lua-dkjson sqlite3 libxml2-utils
      - name: Verify acceptance ledger
        run: lua5.4 tools/roadmap.lua --check
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build graphical executable
        run: cargo build
      - name: X11 graphical smoke test (software-rendered)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/gui_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typefinch-gui-smoke
          path: |
            typefinch-window.png
            typefinch-light.png
            typefinch-dark.png
            typefinch-gui-smoke.log
            typefinch-window-manager.log
            typefinch-profile.svg
            typefinch-profile.md
          if-no-files-found: ignore
