name: Typefinch CI
# GitHub commit statuses expose verified CI outcomes to repository tooling
# that cannot enumerate Actions push runs. Only status metadata is published.
permissions:
  contents: read
  statuses: write
concurrency:
  group: typefinch-${{ github.workflow }}-${{ github.ref }}
  # Preserve running acceptance evidence when several directors push main.
  # GitHub retains the newest pending run; completed running runs are never
  # interrupted merely because a newer commit entered the queue.
  cancel-in-progress: false
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate Bash test harness syntax before package installation
        run: |
          for script in tests/*.sh; do
            bash -n "$script"
          done
          git diff --check HEAD
      - name: Native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends weston x11-xkb-utils libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config xvfb xdotool imagemagick mesa-utils openbox xclip lua5.4 lua-dkjson sqlite3 libxml2-utils fonts-noto-core fonts-noto-cjk
      - name: Verify acceptance ledger
        run: lua5.4 tools/roadmap.lua --check
      - name: Audit brand swatch and semantic accent contrast
        run: lua5.4 tools/color_audit.lua --check
      - name: Assert tracked dependency resolution
        run: |
          git ls-files --error-unmatch Cargo.lock
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Build
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Installed Unicode font coverage (CJK, Arabic, Hebrew)
        run: TYPEFINCH_QA_UNICODE_FONTS=1 cargo test fonts::tests::system_noto_fallbacks_render_required_glyphs -- --nocapture
      - name: Build graphical executable
        run: cargo build --locked
      - name: Native starter ANSI base/Shift layers with XKB and offline fallback
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/starter_layout_gui_smoke.sh
      - name: Native adaptive drill and identical-source retest without private-data persistence
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/training_gui_smoke.sh
      - name: Verify headless version and help flags
        run: |
          ./target/debug/typefinch --version | grep -Fx "typefinch $(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          ./target/debug/typefinch --help | grep -F "GUI shortcuts:"
          if ./target/debug/typefinch --unsupported; then exit 1; fi
      - name: Native Wayland GUI synthetic Hyprland inventory attach/detach and recovery
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/hotplug_gui_smoke.sh
      - name: Synthetic Hyprland two-keyboard inventory lifecycle
        run: bash tests/hyprland_fixture_smoke.sh
      - name: Synthetic Wayland parent subprocess and metadata validation
        run: bash tests/wayland_fixture_smoke.sh
      - name: Native Wayland seat protocol probe (no keyboard subscriptions)
        run: bash tests/wayland_seat_smoke.sh
      - name: Nested Weston virtual keyboard seat probe (no physical device)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/wayland_virtual_seat_smoke.sh
      - name: Nested Weston Wayland GUI typing and aggregate provenance
        run: bash tests/wayland_gui_guarded.sh
      - name: X11 aggregate seat fallback (read-only)
        run: xvfb-run -a -s "-screen 0 1280x900x24" env XDG_SESSION_TYPE=x11 TYPEFINCH_QA_X11_SEAT=1 cargo test devices::tests::native_x11_aggregate_seat_is_read_only -- --nocapture
      - name: Read-only keyboard inspector CLI (X11 and disconnected session)
        run: bash tests/inspector_cli_smoke.sh
      - name: Native timed-deadline and late-input GUI regression
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/timing_deadline_smoke.sh
      - name: Native keyboard-only custom file import and symlink rejection
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/gui_import_smoke.sh
      - name: Native keyboard-only profile goal transfer and isolation
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/goals_gui_smoke.sh
      - name: Native custom multiline Enter input and private persistence
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/multiline_gui_smoke.sh
      - name: Native keyboard Tab/Enter profile creation and guide visibility
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/keyboard_navigation_smoke.sh
      - name: GitHub-hosted SVG actual browser render
        if: github.event_name != 'pull_request'
        run: bash tests/github_card_browser_smoke.sh
      - name: Arabic and Hebrew native rendering smoke (not BiDi acceptance)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/rtl_gui_smoke.sh
      - name: Native Arabic and Hebrew XKB emulated keypress scoring
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/rtl_input_gui_smoke.sh
      - name: Native X11 Shift and German AltGr text scoring
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/altgr_gui_smoke.sh
      - name: X11 graphical smoke test (software-rendered)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/gui_smoke.sh
      - name: Verify CI did not rewrite Cargo.lock
        if: always()
        run: git diff --exit-code -- Cargo.lock
      - name: Build optimized Linux preview
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked
      - name: Package versioned Linux archive
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          lua5.4 tools/package_release.lua "$VERSION" "$GITHUB_SHA"
      - name: Verify user-local install and rollback
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: bash tests/release_smoke.sh
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        with:
          name: typefinch-linux-preview
          path: |
            dist/typefinch-*.tar.gz
            dist/typefinch-*.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typefinch-gui-smoke
          path: |
            typefinch-window.png
            typefinch-wayland-virtual.png
            typefinch-wayland-rtl-*.png
            typefinch-light.png
            typefinch-dark.png
            typefinch-narrow.png
            typefinch-hidpi.png
            typefinch-geometry-*.png
            typefinch-starter-full-*.png
            typefinch-training-followup.png
            typefinch-hotplug-*.png
            typefinch-reference-*.png
            typefinch-recovery.png
            typefinch-heatmap.png
            rtl-*.png
            typefinch-github-card-browser.png
            typefinch-gui-smoke.log
            typefinch-window-manager.log
            typefinch-profile.svg
            typefinch-profile.md
            typefinch-profile.png
          if-no-files-found: ignore
      - name: Publish machine-readable main-branch CI result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Preserve the actual preceding job result. This status cannot
          # make failing Rust/GUI checks pass or erase earlier failures.
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          printf '{"state":"%s","context":"typefinch/full-native-ci","description":"Rust and virtual graphical acceptance","target_url":"%s/%s/actions/runs/%s"}' \
            "$state" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | curl --fail-with-body --silent --show-error --retry 2 \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              >/dev/null
