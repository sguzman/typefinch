name: Typefinch CI
concurrency:
  group: typefinch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config xvfb xdotool imagemagick mesa-utils openbox xclip lua5.4 lua-dkjson sqlite3 libxml2-utils
      - name: Verify acceptance ledger
        run: lua5.4 tools/roadmap.lua --check
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build graphical executable
        run: cargo build
      - name: Verify headless version and help flags
        run: |
          ./target/debug/typefinch --version | grep -Fx "typefinch $(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          ./target/debug/typefinch --help | grep -F "GUI shortcuts:"
          if ./target/debug/typefinch --unsupported; then exit 1; fi
      - name: X11 graphical smoke test (software-rendered)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/gui_smoke.sh
      - name: Build optimized Linux preview
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked
      - name: Package versioned Linux archive
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          lua5.4 tools/package_release.lua "$VERSION" "$GITHUB_SHA"
      - name: Verify user-local install and rollback
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        run: bash tests/release_smoke.sh
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[package]') || github.event_name == 'workflow_dispatch'
        with:
          name: typefinch-linux-preview
          path: |
            dist/typefinch-*.tar.gz
            dist/typefinch-*.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typefinch-gui-smoke
          path: |
            typefinch-window.png
            typefinch-light.png
            typefinch-dark.png
            typefinch-narrow.png
            typefinch-hidpi.png
            typefinch-gui-smoke.log
            typefinch-window-manager.log
            typefinch-profile.svg
            typefinch-profile.md
            typefinch-profile.png
          if-no-files-found: ignore
