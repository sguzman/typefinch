name: Typefinch experimental egui physical-key compatibility
# Isolated dependency-upgrade probe for T303/T305. Not an acceptance check.
# Never writes credentials, modifies main's Cargo.toml/Cargo.lock, or
# treats API availability as proof of physical Hyprland key routing.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-physical-key-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config
      - name: Resolve newer native physical-key API only in temporary checkout
        run: |
          sed -i 's/eframe = { version = "=0.33.3"/eframe = { version = "=0.35.0"/' Cargo.toml
          grep -F 'eframe = { version = "=0.35.0"' Cargo.toml
          cargo update -p eframe
          cargo tree -i egui | head -30
      - name: Check Typefinch compatibility against the new API
        run: |
          cargo check --all-targets 2>&1 | tee egui-physical-key-probe.log
      - name: Compile native Rust tests against the new API
        run: |
          cargo test --no-run --all-targets
      - name: Save an isolated dependency graph for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typefinch-egui-physical-key-probe
          path: |
            Cargo.toml
            Cargo.lock
            egui-physical-key-probe.log
          if-no-files-found: ignore
