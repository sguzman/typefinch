name: Typefinch experimental egui physical-key compatibility
# Isolated dependency-upgrade probe for T303/T305. Not an acceptance check.
# Never writes credentials, modifies main's Cargo.toml/Cargo.lock, or
# treats API availability as proof of physical Hyprland key routing.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-physical-key-probe.yml
      - tools/egui035_migration_probe.lua
      - tools/egui035_rtl_upstream_backport.lua
      - tools/egui035_physical_probe.lua
      - tests/egui035_physical_emulation_smoke.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config lua5.4 lua-dkjson sqlite3 xvfb openbox xdotool xclip imagemagick x11-xkb-utils fonts-noto-core fonts-noto-cjk weston mesa-utils jq libxml2-utils
      - name: Resolve newer native physical-key API only in temporary checkout
        run: |
          sed -i 's/eframe = { version = "=0.33.3"/eframe = { version = "=0.35.0"/' Cargo.toml
          grep -F 'eframe = { version = "=0.35.0"' Cargo.toml
          cargo update -p eframe
          cargo tree -i egui | head -30
      - name: Backport upstream RTL glyph-count fix in disposable Cargo cache
        run: |
          cargo fetch
          ROOT="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          EP="$(find "$ROOT" -path '*/epaint-0.35.0/src/text/text_layout.rs' -print -quit)"
          EG="$(find "$ROOT" -path '*/egui-0.35.0/src/text_selection/text_cursor_state.rs' -print -quit)"
          test -n "$EP" && test -n "$EG"
          lua5.4 tools/egui035_rtl_upstream_backport.lua "$EP" "$EG"
          # Registry sources are normally immutable; cached Rust fingerprints
          # must not silently reuse pre-backport epaint/egui artifacts.
          cargo clean -p epaint
          cargo clean -p egui
      - name: Apply egui 0.35 compatibility edits in temporary checkout
        run: |
          lua5.4 tools/egui035_migration_probe.lua
          lua5.4 tools/egui035_physical_probe.lua
      - name: Check Typefinch compatibility against the new API
        run: |
          cargo check --all-targets 2>&1 | tee egui-physical-key-probe.log
      - name: Compile native Rust tests against the new API
        run: |
          cargo test --no-run --all-targets
      - name: Execute native Rust regression tests on the migrated checkout
        run: cargo test --all-targets
      - name: Build migrated native graphical executable
        run: cargo build
      - name: Verify physical RightAlt and ISO extra-key routing in native X11 emulation
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/egui035_physical_emulation_smoke.sh
      - name: Native Wayland inventory and virtual compositor regression under egui 0.35
        run: |
          bash tests/hyprland_fixture_smoke.sh
          bash tests/wayland_fixture_smoke.sh
          bash tests/wayland_seat_smoke.sh
          xvfb-run -a -s "-screen 0 1280x900x24" bash tests/wayland_virtual_seat_smoke.sh
          bash tests/wayland_gui_guarded.sh --self-test
          bash tests/wayland_gui_guarded.sh
      - name: Verify existing RTL editor and Unicode Undo through native X11
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/rtl_gui_smoke.sh
      - name: Verify existing AltGr and Spanish OS Compose through native X11
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/altgr_gui_smoke.sh
      - name: Native starter layouts and private adaptive training with egui 0.35
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" bash tests/starter_layout_gui_smoke.sh
          xvfb-run -a -s "-screen 0 1280x900x24" bash tests/training_gui_smoke.sh
      - name: Native input, import, profile and timing regression under egui 0.35
        run: |
          for script in hotplug_gui_smoke timing_deadline_smoke gui_import_smoke goals_gui_smoke multiline_gui_smoke keyboard_navigation_smoke rtl_input_gui_smoke gui_smoke; do
            echo "::group::Native $script"
            xvfb-run -a -s "-screen 0 1280x900x24" bash "tests/$script.sh"
            echo "::endgroup::"
          done
      - name: Save an isolated dependency graph for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typefinch-egui-physical-key-probe
          path: |
            Cargo.toml
            Cargo.lock
            egui-physical-key-probe.log
            rtl-*.png
            typefinch-*.png
          if-no-files-found: ignore
