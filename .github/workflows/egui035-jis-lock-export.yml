name: Typefinch one-time JIS dependency lock export
# Export public Cargo.lock for deterministic promotion of pinned local crates.
# Remove this temporary workflow when the verified lock is committed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui035-jis-lock-export.yml
permissions:
  contents: read
jobs:
  export-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve production candidate against pinned egui vendors
        run: |
          printf '\negui = { path = "third_party/egui-0.35.0" }\negui-winit = { path = "third_party/egui-winit-0.35.0" }\n' >> Cargo.toml
          cargo metadata --format-version 1 --no-deps >/dev/null
          cargo tree -i egui | grep -F 'third_party/egui-0.35.0'
          cargo tree -i egui-winit | grep -F 'third_party/egui-winit-0.35.0'
          sha256sum Cargo.lock
      - name: Export public lockfile to immutable Git object
        run: |
          printf '%s\n' TYPEFINCH_JIS_LOCK_B64_BEGIN
          base64 -w0 Cargo.lock | fold -w 2048 | sed 's/^/TYPEFINCH_JIS_LOCK_PART /'
          printf '%s\n' TYPEFINCH_JIS_LOCK_B64_END
