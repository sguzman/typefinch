name: Typefinch JIS physical-key research probe
# Isolated T305 experiment. Production eframe/egui dependencies remain untouched.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui035-jis-physical-probe.yml
      - tools/egui035_jis_physical_probe.lua
      - tools/jis_xkb_probe.lua
      - third_party/egui-0.35.0/**
      - third_party/egui-winit-0.35.0/**
      - tests/jis_physical_emulation_smoke.sh
permissions:
  contents: read
jobs:
  jis-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config lua5.4 xvfb openbox xdotool x11-xkb-utils libxkbcommon-x11-0 sqlite3 lua-dkjson fonts-noto-core fonts-noto-cjk
      - name: Resolve pinned local egui and winit bridges in temporary checkout
        run: |
          # Both crates are checked in with their upstream licenses. Production
          # Cargo.toml and Cargo.lock remain unchanged in Git on main.
          printf '\negui = { path = "third_party/egui-0.35.0" }\negui-winit = { path = "third_party/egui-winit-0.35.0" }\n' >> Cargo.toml
          lua5.4 tools/jis_xkb_probe.lua
          cargo metadata --format-version 1 --no-deps >/dev/null
          cargo tree -i egui | grep -F 'third_party/egui-0.35.0'
          cargo tree -i egui-winit | grep -F 'third_party/egui-winit-0.35.0'
      - name: Check physical JIS key maps against pinned XKB
        run: cargo test --all-targets
      - name: Build the isolated JIS-enabled native GUI
        run: cargo build
      - name: Exercise true X11 JIS RO/YEN physical events and unscored IME controls
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/jis_physical_emulation_smoke.sh
      - name: Confirm repository checkout changes stay isolated
        if: always()
        run: |
          git diff --check
          git diff --exit-code -- src/app.rs
