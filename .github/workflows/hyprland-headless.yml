name: Typefinch experimental headless Hyprland GUI
# Isolated virtual compositor: never physical-device acceptance.
# The hosted runner has no working Aquamarine GPU/allocator backend.
# This hosted runner has no usable Aquamarine DRM/allocator backend and
# its nested compositor lacks required protocol versions. Keep this experiment
# opt-in until a render-capable runner is configured; no hardware acceptance.
on:
  workflow_dispatch:
jobs:
  native-hyprland:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build locked production GUI
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config
          cargo build --locked
      - name: Run real Hyprland inside isolated Ubuntu container
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e DEBIAN_FRONTEND=noninteractive ubuntu:26.04 bash -euc '
            apt-get -o Acquire::Retries=3 update
            apt-get -o Acquire::Retries=3 install -y --no-install-recommends hyprland weston grim jq procps util-linux file imagemagick libegl1 libgl1 libgl1-mesa-dri libwayland-client0 libxkbcommon0 libfontconfig1 fonts-noto-core
            useradd --uid 1001 --create-home qa
            runuser -u qa -- bash tests/hyprland_headless_smoke.sh
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typefinch-experimental-hyprland
          path: |
            typefinch-hyprland-headless.png
            typefinch-hyprland-inspection.json
          if-no-files-found: ignore
