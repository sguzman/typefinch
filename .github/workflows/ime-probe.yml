name: Typefinch experimental native IME probe
# Separate from required CI: a failed Fcitx/XIM experiment remains unaccepted.
on:
  push:
    branches: [main]
    paths:
      - 'tests/fcitx_ime_gui_smoke.sh'
      - '.github/workflows/ime-probe.yml'
  workflow_dispatch:
jobs:
  native-fcitx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native XIM, Fcitx5 and GUI dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config xvfb xdotool imagemagick mesa-utils openbox lua5.4 lua-dkjson sqlite3 fonts-noto-cjk fcitx5 fcitx5-chinese-addons fcitx5-modules dbus-x11 x11-xkb-utils
      - name: Validate experimental fixture
        run: bash -n tests/fcitx_ime_gui_smoke.sh
      - name: Build native Typefinch GUI
        run: cargo build
      - name: Real Fcitx5 Pinyin XIM candidate commit
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash tests/fcitx_ime_gui_smoke.sh
