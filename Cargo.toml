[package]
name = "typefinch"
version = "0.1.0"
edition = "2024"
description = "A local-first typing laboratory and keyboard training studio"
license = "MIT"
repository = "https://github.com/sguzman/typefinch"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xkbcommon = "0.9"
libc = "0.2"
wayland-client = "0.31"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = true }
resvg = "=0.48.1"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
base64 = "0.22"
cosmic-text = "=0.19.0"

[patch.crates-io]
epaint = { path = "third_party/epaint-0.35.0" }
