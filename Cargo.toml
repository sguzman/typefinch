[package]
name = "typefinch"
version = "0.1.0"
edition = "2024"
description = "A local-first typing laboratory and keyboard training studio"
license = "MIT"
repository = "https://github.com/sguzman/typefinch"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
