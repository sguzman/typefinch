[package]
name = "epaint"
version = "0.35.0"
edition = "2024"
rust-version = "1.92"
description = "Minimal 2D graphics library for GUI work"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emilk/egui"
readme = "README.md"

[lib]

[features]
default = ["default_fonts"]
bytemuck = ["dep:bytemuck", "emath/bytemuck", "ecolor/bytemuck"]
cint = ["ecolor/cint"]
color-hex = ["ecolor/color-hex"]
default_fonts = ["epaint_default_fonts"]
mint = ["emath/mint"]
rayon = ["dep:rayon"]
serde = ["dep:serde", "ahash/serde", "ecolor/serde", "emath/serde", "font-types/serde", "smallvec/serde"]
unity = []
_override_unity = []

[dependencies]
emath = {version="=0.35.0", default-features=false}
ecolor = {version="=0.35.0", default-features=false}
ahash = {version="0.8.12", default-features=false, features=["no-rng","std"]}
font-types = {version="0.11.3", default-features=false, features=["std"]}
harfrust = "0.7.0"
log = {version="0.4.33", features=["std"]}
nohash-hasher = "0.2.0"
parking_lot = "0.12.5"
profiling = {version="1.0", default-features=false}
self_cell = "1.2"
skrifa = {version="0.42.1", default-features=false, features=["std","autohint_shaping"]}
smallvec = "1.15"
unicode-general-category = "1.1"
unicode-segmentation = "1.13"
vello_cpu = {version="0.0.9", default-features=false, features=["std","u8_pipeline","f32_pipeline"]}
bytemuck = {version="1.25", optional=true, features=["derive"]}
document-features = {version="0.2.12", optional=true}
rayon = {version="1.12", optional=true}
serde = {version="1.0", optional=true, features=["derive","rc"]}
epaint_default_fonts = {version="=0.35.0", optional=true}
